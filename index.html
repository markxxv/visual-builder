<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYSIWYG Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style type="text/tailwindcss">
        /* Base editor styles */
        [contenteditable="true"] {
            outline: none;
        }

        [contenteditable="true"]:focus {
            @apply bg-yellow-100;
        }

        .sr-only {
            @apply absolute w-px h-px p-0 -m-px overflow-hidden whitespace-nowrap border-0;
            clip: rect(0, 0, 0, 0);
        }

        /* Grid item controls */
        [data-grid-section] > * {
            @apply relative;
        }

        [data-grid-section] > *:hover .grid-item-delete,
        [data-grid-section] > *:focus-within .grid-item-delete {
            @apply opacity-100;
        }

        .grid-item-delete {
            @apply absolute top-2 right-2 z-[5] flex h-7 w-7 items-center justify-center rounded-lg bg-white text-zinc-400 opacity-0 shadow-sm transition-all duration-150 pointer-events-auto;
        }

        .grid-item-delete:hover {
            @apply bg-red-50 text-red-600;
        }

        .section-controls {
            @apply z-20;
        }

        /* Text Block Section */
        .text_block {
            @apply space-y-6 mt-12;
        }

        .text_block h2 {
            @apply text-2xl font-semibold;
        }

        .text_block .content {
            @apply space-y-4 text-gray-600 leading-relaxed;
        }

        /* Prose styles only for text_block */
        .text_block.prose h2 {
            @apply text-2xl font-bold mt-4 mb-2;
        }

        .text_block.prose h3 {
            @apply text-xl font-semibold mt-4 mb-2;
        }

        .text_block.prose h4 {
            @apply text-lg font-semibold mt-4 mb-2;
        }

        .text_block.prose p {
            @apply mt-2 mb-2;
        }

        .text_block.prose ul, .text_block.prose ol {
            @apply mt-2 mb-2 pl-6;
        }

        .text_block.prose ul {
            @apply list-disc;
        }

        .text_block.prose ol {
            @apply list-decimal;
        }

        .text_block.prose li {
            @apply mt-1 mb-1;
        }

        /* Stats Cards Section */
        .stats_cards .card {
            @apply bg-white border border-gray-100 rounded-lg p-6;
        }

        .stats_cards .card_value {
            @apply text-3xl font-bold text-red-500 mb-2;
        }

        .stats_cards .card_label {
            @apply text-sm text-gray-600;
        }

        /* Icon Cards Section */
        .icon_cards .card {
            @apply bg-white border border-gray-100 rounded-lg p-6;
        }

        .icon_cards .card_inner {
            @apply flex items-start;
        }

        .icon_cards .icon_wrapper {
            @apply bg-red-50 rounded-lg p-3 mr-4;
        }

        .icon_cards .icon {
            @apply w-6 h-6 text-red-400;
        }

        .icon_cards .card_title {
            @apply font-semibold mb-2 text-sm;
        }

        .icon_cards .card_description {
            @apply text-sm text-gray-600;
        }

        /* Price Section */
        .price_section {
            @apply space-y-6;
        }

        .price_section h2 {
            @apply text-2xl font-semibold;
        }

        .price_section .price_card {
            @apply bg-gray-50 border border-gray-100 rounded-lg p-6;
        }

        .price_section .price_header {
            @apply text-center mb-6;
        }

        .price_section .price_label {
            @apply text-sm text-gray-600 mb-2;
        }

        .price_section .price_value {
            @apply text-5xl font-bold text-red-500;
        }

        .price_section .payment_steps {
            @apply bg-white rounded-lg p-6 space-y-4;
        }

        .price_section .payment_title {
            @apply text-sm font-medium text-gray-700 mb-3;
        }

        .price_section .payment_row {
            @apply flex items-center justify-between py-3 border-b border-gray-100;
        }

        .price_section .payment_row:last-child {
            @apply border-b-0;
        }

        .price_section .payment_label {
            @apply flex items-start;
        }

        .price_section .checkmark {
            @apply w-5 h-5 text-red-400 mr-3 mt-0.5 shrink-0;
        }

        .price_section .payment_text {
            @apply text-sm text-gray-600;
        }

        .price_section .payment_amount {
            @apply text-lg font-semibold text-gray-900;
        }

        .price_section .price_note {
            @apply text-xs text-gray-500 text-center mt-4;
        }

        /* Expenses Section */
        .expenses_section {
            @apply space-y-6;
        }

        .expenses_section h2 {
            @apply text-2xl font-semibold;
        }

        .expenses_section .expenses_card {
            @apply bg-gray-50 rounded-lg p-6 border border-gray-200;
        }

        .expenses_section .expenses_title {
            @apply text-sm font-medium text-gray-700 mb-4;
        }

        .expenses_section .expenses_list {
            @apply space-y-2;
        }

        .expenses_section .expense_item {
            @apply flex items-start;
        }

        .expenses_section .arrow_icon {
            @apply w-4 h-4 text-gray-400 mr-2 mt-0.5 shrink-0;
        }

        .expenses_section .expense_text {
            @apply text-sm text-gray-600;
        }

        /* Process Steps Section */
        .process_steps {
            @apply space-y-6;
        }

        .process_steps h2 {
            @apply text-2xl font-semibold;
        }

        .process_steps .step {
            @apply flex items-start;
        }

        .process_steps .step_number {
            @apply bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shrink-0 mr-4 font-semibold text-sm;
        }

        .process_steps .step_content {
            @apply pt-1;
        }

        .process_steps .step_title {
            @apply font-semibold mb-1;
        }

        .process_steps .step_description {
            @apply text-sm text-gray-600;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="editorApp()" class="min-h-screen">
        <!-- SVG Edit Modal -->
        <div 
            x-show="svgModalOpen" 
            @click.self="svgModalOpen = false"
            x-transition.opacity
            class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
            style="display: none;"
        >
            <div 
                class="bg-white rounded-lg p-6 max-w-2xl w-full"
                @click.stop
            >
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Edit SVG Icon</h3>
                    <button 
                        @click="svgModalOpen = false"
                        class="text-gray-400 hover:text-gray-600"
                    >
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <textarea 
                    x-model="currentSvgCode"
                    class="w-full h-64 border border-gray-300 rounded-md p-3 font-mono text-sm"
                    placeholder="Paste SVG code here..."
                ></textarea>
                
                <div class="flex justify-end gap-2 mt-4">
                    <button 
                        @click="svgModalOpen = false"
                        class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
                    >
                        Cancel
                    </button>
                    <button 
                        @click="updateSvg()"
                        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors"
                    >
                        Apply
                    </button>
                </div>
            </div>
        </div>

        <!-- Drawer overlay -->
        <div
            x-show="drawerOpen"
            @click="closeDrawer()"
            x-transition.opacity.duration.200ms
            class="fixed inset-0 z-40 bg-zinc-950 opacity-20"
            style="display: none;"
        ></div>

        <!-- Drawer -->
        <aside
            x-show="drawerOpen"
            @keydown.escape.window="closeDrawer()"
            x-transition:enter="transform transition ease-out duration-200"
            x-transition:enter-start="-translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transform transition ease-in duration-150"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="-translate-x-full"
            class="fixed inset-y-0 left-0 z-50 flex w-[360px] max-w-[calc(100vw-16px)] flex-col bg-white shadow-xl"
            style="display: none;"
            aria-label="Block library"
        >
            <div class="shrink-0 border-b border-zinc-100 px-4 pb-3 pt-4">
                <div class="mb-3 flex h-8 items-center justify-between">
                    <div class="flex min-w-0 items-baseline gap-2">
                        <h2 class="text-[14px] font-semibold tracking-[-0.01em] text-zinc-950">Blocks</h2>
                        <span class="text-[11px] tabular-nums text-zinc-400" x-text="filteredTemplates.length"></span>
                    </div>

                    <button
                        @click="closeDrawer()"
                        type="button"
                        class="flex h-8 w-8 items-center justify-center rounded-lg text-zinc-400 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                        title="Close"
                        aria-label="Close block library"
                    >
                        <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="relative">
                    <i
                        data-lucide="search"
                        class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400"
                        aria-hidden="true"
                    ></i>

                    <input
                        x-ref="templateSearch"
                        x-model="templateSearch"
                        type="text"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Search blocks or tags"
                        class="h-10 w-full rounded-lg bg-zinc-100 pl-9 pr-9 text-[13px] text-zinc-950 outline-none placeholder:text-zinc-400 focus:bg-zinc-100 focus:ring-2 focus:ring-zinc-200"
                        aria-label="Search blocks"
                    >

                    <button
                        x-show="templateSearch"
                        @click="templateSearch = ''; $refs.templateSearch.focus()"
                        type="button"
                        class="absolute right-1.5 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-md text-zinc-400 transition-colors hover:bg-white hover:text-zinc-950"
                        aria-label="Clear search"
                        style="display: none;"
                    >
                        <i data-lucide="x" class="h-3.5 w-3.5" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="min-h-0 flex-1 overflow-y-auto px-2 py-2">
                <div class="space-y-1">
                    <template x-for="template in filteredTemplates" :key="template.name">
                        <button
                            @click="addSection(template); closeDrawer()"
                            type="button"
                            class="group flex w-full items-center gap-3 rounded-xl p-2 text-left transition-colors duration-150 hover:bg-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-zinc-300"
                        >
                            <div class="h-14 w-[76px] shrink-0 overflow-hidden rounded-lg bg-zinc-100">
                                <img
                                    :src="template.image"
                                    :alt="template.name"
                                    class="h-full w-full object-cover object-left"
                                >
                            </div>

                            <div class="min-w-0 flex-1 py-0.5">
                                <div class="mb-1.5 flex items-center justify-between gap-2">
                                    <p
                                        class="truncate text-[13px] font-medium tracking-[-0.01em] text-zinc-900"
                                        x-text="template.name"
                                    ></p>

                                    <i
                                        data-lucide="plus"
                                        class="h-3.5 w-3.5 shrink-0 text-zinc-300 transition-colors group-hover:text-zinc-600"
                                        aria-hidden="true"
                                    ></i>
                                </div>

                                <div class="flex flex-wrap gap-x-1.5 gap-y-1">
                                    <template x-for="tag in template.tags" :key="tag">
                                        <span
                                            class="text-[10px] leading-4 text-zinc-400"
                                            x-text="'#' + tag"
                                        ></span>
                                    </template>
                                </div>
                            </div>
                        </button>
                    </template>
                </div>

                <div
                    x-show="filteredTemplates.length === 0"
                    class="px-4 py-12 text-center"
                    style="display: none;"
                >
                    <p class="text-[13px] font-medium text-zinc-700">No blocks found</p>
                    <p class="mt-1 text-[11px] leading-4 text-zinc-400">Try another name or tag.</p>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <div class="max-w-4xl mx-auto py-8 px-4">
            <!-- Canvas with toolbar inside -->
            <div class="bg-white border border-gray-200 rounded-lg min-h-[600px]">
                <!-- Toolbar - sticky inside canvas -->
                <div class="sticky top-0 z-10 rounded-t-lg bg-white">
                    <div class="flex min-h-14 items-center gap-1.5 overflow-x-auto border-b border-zinc-100 px-3 py-2">
                        <button
                            @click="openDrawer()"
                            type="button"
                            class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg bg-zinc-100 px-3 text-[13px] font-medium text-zinc-800 transition-colors duration-150 hover:bg-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                            title="Templates"
                        >
                            <i data-lucide="layout-template" class="h-4 w-4" aria-hidden="true"></i>
                            <span class="hidden sm:inline">Templates</span>
                        </button>

                        <div class="mx-1 h-5 w-px shrink-0 bg-zinc-200"></div>

                        <div class="flex shrink-0 items-center gap-0.5">
                            <button
                                @click="undo()"
                                :disabled="!canUndo"
                                :class="!canUndo ? 'cursor-not-allowed text-zinc-300' : 'text-zinc-500 hover:bg-zinc-100 hover:text-zinc-950'"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Undo (Ctrl+Z)"
                                aria-label="Undo"
                            >
                                <i data-lucide="undo-2" class="h-4 w-4" aria-hidden="true"></i>
                            </button>

                            <button
                                @click="redo()"
                                :disabled="!canRedo"
                                :class="!canRedo ? 'cursor-not-allowed text-zinc-300' : 'text-zinc-500 hover:bg-zinc-100 hover:text-zinc-950'"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Redo (Ctrl+Y)"
                                aria-label="Redo"
                            >
                                <i data-lucide="redo-2" class="h-4 w-4" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="mx-1 h-5 w-px shrink-0 bg-zinc-200"></div>

                        <div class="flex shrink-0 items-center gap-0.5">
                            <button
                                @click="formatText('bold')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Bold"
                                aria-label="Bold"
                            >
                                <i data-lucide="bold" class="h-4 w-4" aria-hidden="true"></i>
                            </button>

                            <button
                                @click="formatText('italic')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Italic"
                                aria-label="Italic"
                            >
                                <i data-lucide="italic" class="h-4 w-4" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="mx-1 h-5 w-px shrink-0 bg-zinc-200"></div>

                        <div class="flex shrink-0 items-center gap-0.5">
                            <button
                                @click="formatText('h2')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Heading H2"
                                aria-label="Heading H2"
                            >
                                <i data-lucide="heading-2" class="h-4 w-4" aria-hidden="true"></i>
                            </button>

                            <button
                                @click="formatText('h3')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Heading H3"
                                aria-label="Heading H3"
                            >
                                <i data-lucide="heading-3" class="h-4 w-4" aria-hidden="true"></i>
                            </button>

                            <button
                                @click="formatText('h4')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Heading H4"
                                aria-label="Heading H4"
                            >
                                <i data-lucide="heading-4" class="h-4 w-4" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="mx-1 h-5 w-px shrink-0 bg-zinc-200"></div>

                        <div class="flex shrink-0 items-center gap-0.5">
                            <button
                                @click="formatText('insertUnorderedList')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Bulleted list"
                                aria-label="Bulleted list"
                            >
                                <i data-lucide="list" class="h-4 w-4" aria-hidden="true"></i>
                            </button>

                            <button
                                @click="formatText('insertOrderedList')"
                                type="button"
                                class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                title="Numbered list"
                                aria-label="Numbered list"
                            >
                                <i data-lucide="list-ordered" class="h-4 w-4" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="ml-auto h-5 w-px shrink-0 bg-zinc-200"></div>

                        <button
                            @click="saveToConsole()"
                            type="button"
                            class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg bg-zinc-950 px-3 text-[13px] font-medium text-white transition-colors duration-150 hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400"
                            title="Save"
                        >
                            <i data-lucide="save" class="h-4 w-4" aria-hidden="true"></i>
                            <span class="hidden sm:inline">Save</span>
                        </button>
                    </div>
                </div>

                <!-- Content area -->
                <div class="p-8">
                    <template x-for="(section, index) in sections" :key="section.id">
                        <div class="group relative mb-6 rounded-xl p-6 transition-colors duration-150 hover:bg-zinc-50 focus-within:bg-zinc-50">
                            <!-- Section controls -->
                            <div class="section-controls absolute right-3 top-3 z-20 flex items-center rounded-xl bg-white p-1 text-zinc-500 opacity-0 shadow-sm transition-all duration-150 group-hover:opacity-100 group-focus-within:opacity-100">
                                <!-- Column selector for grid sections -->
                                <template x-if="section.hasColumnSelector">
                                    <div class="relative" x-data="{ open: false }">
                                        <button
                                            @click="open = !open"
                                            @click.outside="open = false"
                                            type="button"
                                            class="flex h-8 w-8 items-center justify-center rounded-lg transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                            :class="open ? 'bg-zinc-100 text-zinc-950' : ''"
                                            title="Columns"
                                            aria-label="Change column count"
                                        >
                                            <i data-lucide="columns-3" class="h-3.5 w-3.5" aria-hidden="true"></i>
                                        </button>

                                        <!-- Column popover -->
                                        <div
                                            x-show="open"
                                            x-transition:enter="transition ease-out duration-100"
                                            x-transition:enter-start="opacity-0 -translate-y-1"
                                            x-transition:enter-end="opacity-100 translate-y-0"
                                            x-transition:leave="transition ease-in duration-75"
                                            x-transition:leave-start="opacity-100 translate-y-0"
                                            x-transition:leave-end="opacity-0 -translate-y-1"
                                            class="absolute right-0 top-full z-50 mt-2 w-[188px] rounded-xl bg-white p-2 shadow-lg"
                                            style="display: none;"
                                        >
                                            <div class="flex items-center justify-between px-1 pb-2 pt-0.5">
                                                <span class="text-[11px] font-medium text-zinc-500">Columns</span>
                                                <span class="text-[11px] tabular-nums text-zinc-400" x-text="section.columns"></span>
                                            </div>

                                            <div class="grid grid-cols-5 gap-1 rounded-lg bg-zinc-100 p-1">
                                                <template x-for="col in [1, 2, 3, 4, 6]" :key="col">
                                                    <label
                                                        class="flex h-8 cursor-pointer items-center justify-center rounded-md text-[11px] font-medium transition-colors duration-150"
                                                        :class="section.columns === col ? 'bg-white text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-950'"
                                                    >
                                                        <input
                                                            type="radio"
                                                            :value="col"
                                                            x-model.number="section.columns"
                                                            @change="updateColumns(index, col)"
                                                            class="sr-only"
                                                        >
                                                        <span x-text="col"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- Add item -->
                                <template x-if="section.hasColumnSelector">
                                    <button
                                        @click="addGridItem(index)"
                                        type="button"
                                        class="flex h-8 w-8 items-center justify-center rounded-lg transition-colors duration-150 hover:bg-zinc-100 hover:text-zinc-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300"
                                        title="Add item"
                                        aria-label="Add item"
                                    >
                                        <i data-lucide="plus" class="h-3.5 w-3.5" aria-hidden="true"></i>
                                    </button>
                                </template>

                                <div class="mx-1 h-4 w-px bg-zinc-100"></div>

                                <button
                                    @click="moveSection(index, -1)"
                                    :disabled="index === 0"
                                    :class="index === 0 ? 'cursor-not-allowed text-zinc-300' : 'hover:bg-zinc-100 hover:text-zinc-950'"
                                    type="button"

                                    title="Move up"

                                    <i data-lucide="arrow-up" class="h-3.5 w-3.5" aria-hidden="true"></i>
                                </button>

                                <button
                                    @click="moveSection(index, 1)"

                                    :class="index === sections.length - 1 ? 'cursor-not-allowed text-zinc-300' : 'hover:bg-zinc-100 hover:text-zinc-950'"

                                </button>

                            <!-- Editable content -->
                            <div
                                x-html="section.html"
                                contenteditable="true"
                                @blur="updateSection(index, $event)"
                                class="rounded-lg outline-none"
                            ></div>
                        </div>
                    </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- Add item button for grid sections -->
                                <template x-if="section.hasColumnSelector">
                                    <button 
                                        @click="addGridItem(index)"
                                        class="w-8 h-8 flex items-center justify-center border border-gray-300 rounded bg-white hover:bg-gray-100 transition-colors"
                                        title="Add Block"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                            <path d="M12 5l0 14" />
                                            <path d="M5 12l14 0" />
                                        </svg>
                                    </button>
                                </template>
                                
                                <button 
                                    @click="moveSection(index, -1)" 
                                    :disabled="index === 0"
                                    :class="index === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100'"
                                    class="w-8 h-8 flex items-center justify-center border border-gray-300 rounded bg-white transition-colors"
                                >
                                    ↑

                                <button 
                                    @click="moveSection(index, 1)" 
                                    :disabled="index === sections.length - 1"
                                    :class="index === sections.length - 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100'"

                                @blur="updateSection(index, $event)"
                            ></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

                    {
                        name: 'Process Steps',
                        tags: ["process","steps","workflow","timeline"],
                        image: 'img/06_steps.png',
                        hasColumnSelector: true,
                        defaultColumns: 1,
                        itemTemplate: `
                            <div class="step">
                                <div class="step_number" contenteditable="true">1</div>
                                <div class="step_content">
                                    <h3 class="step_title" contenteditable="true">New Step</h3>

                        `,
                        html: `
                            <article class="process_steps">
                                <h2 contenteditable="true">How It Works</h2>
                                <div class="grid grid-cols-1 gap-4" data-grid-section>
                                    <div class="step">
                                        <div class="step_number" contenteditable="true">1</div>

                                            <p class="step_description" contenteditable="true">Description of the second process stage</p>

                                        <div class="step_content">

                    }
                ],
                sections: [],
                nextId: 1,

                get filteredTemplates() {
                    const query = this.templateSearch.trim().toLowerCase();

                    if (!query) {
                        return this.templates;
                    }

                    const terms = query.split(/\s+/).filter(Boolean);

                    return this.templates.filter((template) => {
                        const searchable = [
                            template.name,
                            ...(template.tags || [])
                        ].join(' ').toLowerCase();

                        return terms.every((term) => searchable.includes(term));
                    });
                },

                openDrawer() {
                    this.templateSearch = '';
                    this.drawerOpen = true;

                    this.$nextTick(() => {
                        this.$refs.templateSearch?.focus();
                        window.lucide?.createIcons({
                            attrs: {
                                'stroke-width': 1.7
                            }
                        });
                    });
                },

                closeDrawer() {
                    this.drawerOpen = false;
                },

                get canUndo() {
                    return this.historyIndex > 0;
                },

                get canRedo() {
                    return this.historyIndex < this.history.length - 1;
                },

                init() {
                    this.addSection(this.templates[0]);
                    this.saveState();
                    
                    document.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                            e.preventDefault();
                            this.undo();
                        } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                            e.preventDefault();
                            this.redo();
                        }
                    });
                    
                    document.addEventListener('click', (e) => {
                        const svgElement = e.target.closest('svg');
                        if (svgElement && svgElement.closest('.icon_wrapper') && !svgElement.closest('.absolute')) {
                            e.preventDefault();
                            e.stopPropagation();
                            this.openSvgModal(svgElement);
                        }
                    });

                    this.$watch('templateSearch', () => {
                        this.$nextTick(() => {
                            window.lucide?.createIcons({
                                attrs: {
                                    'stroke-width': 1.7
                                }
                            });
                        });
                    });

                    this.$watch('sections', () => {
                        this.$nextTick(() => {
                            this.addDeleteButtonsToGridItems();
                            window.lucide?.createIcons({
                                attrs: {
                                    'stroke-width': 1.7
                                }
                            });
                        });
                    }, { deep: true });

                    document.addEventListener('click', (e) => {
                        if (e.target.closest('.grid-item-delete')) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            const deleteBtn = e.target.closest('.grid-item-delete');
                            const gridItem = deleteBtn.parentElement;
                            const gridSection = gridItem.parentElement;
                            const sectionElement = gridSection.closest('.relative.group');
                            
                            const allSections = Array.from(document.querySelectorAll('.relative.group'));
                            const sectionIndex = allSections.indexOf(sectionElement);
                            
                            const gridItems = Array.from(gridSection.children);
                            const itemIndex = gridItems.indexOf(gridItem);
                            
                            if (sectionIndex !== -1 && itemIndex !== -1) {
                                gridItem.remove();
                                
                                const contentElement = sectionElement.querySelector('[contenteditable]');
                                if (contentElement) {
                                    this.sections[sectionIndex].html = contentElement.innerHTML;
                                    this.saveState();
                                }
                            }
                        }
                    });
                },

                addDeleteButtonsToGridItems() {
                    const gridSections = document.querySelectorAll('[data-grid-section]');
                    gridSections.forEach((grid) => {
                        const items = Array.from(grid.children);
                        items.forEach((item) => {
                            if (!item.querySelector('.grid-item-delete')) {
                                const deleteBtn = document.createElement('button');
                                deleteBtn.className = 'grid-item-delete';
                                deleteBtn.innerHTML = '<i data-lucide="x" class="h-3.5 w-3.5" aria-hidden="true"></i>';
                                deleteBtn.type = 'button';
                                deleteBtn.title = 'Remove item';
                                deleteBtn.setAttribute('aria-label', 'Remove item');
                                item.appendChild(deleteBtn);
                            }
                        });
                    });
                },

                saveState() {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                    this.history.push(JSON.parse(JSON.stringify(this.sections)));
                    this.historyIndex++;
                    
                    if (this.history.length > 50) {
                        this.history.shift();
                        this.historyIndex--;
                    }
                },

                undo() {
                    if (!this.canUndo) return;
                    
                    this.historyIndex--;
                    this.sections = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    
                    this.$nextTick(() => {
                        this.sections.forEach((section, index) => {
                            if (section.hasColumnSelector) {
                                this.applyGridColumns(index, section.columns);
                            }
                        });
                    });
                },

                redo() {
                    if (!this.canRedo) return;
                    
                    this.historyIndex++;
                    this.sections = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    
                    this.$nextTick(() => {
                        this.sections.forEach((section, index) => {
                            if (section.hasColumnSelector) {
                                this.applyGridColumns(index, section.columns);
                            }
                        });
                    });
                },

                openSvgModal(svgElement) {
                    this.currentSvgElement = svgElement;
                    this.currentSvgCode = svgElement.outerHTML;
                    this.svgModalOpen = true;
                },

                updateSvg() {
                    if (!this.currentSvgElement || !this.currentSvgCode) return;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = this.currentSvgCode.trim();
                    const newSvg = tempDiv.querySelector('svg');
                    
                    if (newSvg) {
                        this.currentSvgElement.parentNode.replaceChild(newSvg, this.currentSvgElement);
                        
                        const sectionElement = newSvg.closest('.relative.group');
                        if (sectionElement) {
                            const allSections = document.querySelectorAll('.relative.group');
                            const index = Array.from(allSections).indexOf(sectionElement);
                            if (index !== -1) {
                                const contentElement = sectionElement.querySelector('[contenteditable]');
                                if (contentElement) {
                                    this.sections[index].html = contentElement.innerHTML;
                                    this.saveState();
                                }
                            }
                        }
                    }
                    
                    this.svgModalOpen = false;
                    this.currentSvgElement = null;
                    this.currentSvgCode = '';
                },

                saveToConsole() {
                    const state = JSON.stringify(this.sections, null, 2);
                    console.log('Current Editor State:', state);
                    console.log('To load this state, use: loadState(data)');
                    return state;
                },

                loadState(data) {
                    this.sections = JSON.parse(JSON.stringify(data));
                    this.saveState();
                    this.$nextTick(() => {
                        this.sections.forEach((section, index) => {
                            if (section.hasColumnSelector) {
                                this.applyGridColumns(index, section.columns);
                            }
                        });
                    });
                },

                addSection(template) {
                    const section = {
                        id: this.nextId++,
                        name: template.name,
                        html: template.html,
                        hasColumnSelector: template.hasColumnSelector || false,
                        columns: template.defaultColumns || 2,
                        itemTemplate: template.itemTemplate || ''
                    };
                    this.sections.push(section);
                    
                    if (section.hasColumnSelector) {
                        this.$nextTick(() => {
                            this.applyGridColumns(this.sections.length - 1, section.columns);
                            this.saveState();
                        });
                    } else {
                        this.saveState();
                    }
                },

                removeSection(index) {
                    this.sections.splice(index, 1);
                    this.saveState();
                },

                moveSection(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex >= 0 && newIndex < this.sections.length) {
                        const temp = this.sections[index];
                        this.sections[index] = this.sections[newIndex];
                        this.sections[newIndex] = temp;
                        this.saveState();
                    }
                },

                updateSection(index, event) {
                    this.sections[index].html = event.target.innerHTML;
                    this.saveState();
                },

                addGridItem(index) {
                    const section = this.sections[index];
                    if (!section.itemTemplate) return;
                    
                    const sectionElements = document.querySelectorAll('.relative.group');
                    if (!sectionElements[index]) return;
                    
                    const gridElement = sectionElements[index].querySelector('[data-grid-section]');
                    if (!gridElement) return;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = section.itemTemplate.trim();
                    const newItem = tempDiv.firstChild;
                    
                    gridElement.appendChild(newItem);
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'grid-item-delete';
                    deleteBtn.innerHTML = '<i data-lucide="x" class="h-3.5 w-3.5" aria-hidden="true"></i>';
                    deleteBtn.type = 'button';
                    deleteBtn.title = 'Remove item';
                    deleteBtn.setAttribute('aria-label', 'Remove item');
                    newItem.appendChild(deleteBtn);
                    
                    this.sections[index].html = sectionElements[index].querySelector('[contenteditable]').innerHTML;
                    this.saveState();

                    this.$nextTick(() => {
                        window.lucide?.createIcons({
                            attrs: {
                                'stroke-width': 1.7
                            }
                        });
                    });
                },

                updateColumns(index, columns) {
                    this.sections[index].columns = columns;
                    this.applyGridColumns(index, columns);
                    this.saveState();
                },

                applyGridColumns(index, columns) {
                    const sectionElements = document.querySelectorAll('.relative.group');
                    if (!sectionElements[index]) return;
                    
                    const gridElement = sectionElements[index].querySelector('[data-grid-section]');
                    if (!gridElement) return;
                    
                    gridElement.classList.remove('lg:grid-cols-1', 'lg:grid-cols-2', 'lg:grid-cols-3', 'lg:grid-cols-4', 'lg:grid-cols-6');
                    gridElement.classList.add(`lg:grid-cols-${columns}`);
                    
                    this.sections[index].html = sectionElements[index].querySelector('[contenteditable]').innerHTML;
                },

                formatText(command) {
                    if (command === 'h2' || command === 'h3' || command === 'h4') {
                        const selection = window.getSelection();
                        if (!selection.rangeCount) return;
                        
                        const range = selection.getRangeAt(0);
                        let element = range.commonAncestorContainer;
                        
                        if (element.nodeType === 3) {
                            element = element.parentElement;
                        }
                        
                        let targetElement = element;
                        while (targetElement && !['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'P', 'DIV'].includes(targetElement.tagName)) {
                            targetElement = targetElement.parentElement;
                        }
                        
                        if (!targetElement) {
                            document.execCommand('formatBlock', false, command);
                            return;
                        }
                        
                        const headingClasses = {
                            'h2': 'text-2xl font-semibold',
                            'h3': 'text-xl font-semibold',
                            'h4': 'text-lg font-semibold'
                        };
                        
                        if (['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(targetElement.tagName)) {
                            const newElement = document.createElement(command);
                            newElement.innerHTML = targetElement.innerHTML;
                            newElement.className = '';
                            newElement.className = headingClasses[command];
                            
                            if (targetElement.hasAttribute('contenteditable')) {
                                newElement.setAttribute('contenteditable', 'true');
                            }
                            
                            targetElement.parentNode.replaceChild(newElement, targetElement);
                        } else {
                            const newElement = document.createElement(command);
                            newElement.innerHTML = targetElement.innerHTML;
                            newElement.className = headingClasses[command];
                            
                            if (targetElement.hasAttribute('contenteditable')) {
                                newElement.setAttribute('contenteditable', 'true');
                            }
                            
                            targetElement.parentNode.replaceChild(newElement, targetElement);
                        }
                        
                        return;
                    }
                    
                    if (command === 'insertUnorderedList' || command === 'insertOrderedList') {
                        const selection = window.getSelection();
                        if (!selection.rangeCount) return;
                        
                        const range = selection.getRangeAt(0);
                        
                        let editableElement = range.commonAncestorContainer;
                        if (editableElement.nodeType === 3) {
                            editableElement = editableElement.parentElement;
                        }
                        while (editableElement && editableElement.getAttribute('contenteditable') !== 'true') {
                            editableElement = editableElement.parentElement;
                        }
                        
                        if (!editableElement) return;
                        
                        editableElement.focus();
                        document.execCommand(command, false, null);
                        
                        return;
                    }
                    
                    document.execCommand(command, false, null);
                }
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons({
                attrs: {
                    'stroke-width': 1.7
                }
            });
        });
    </script>
